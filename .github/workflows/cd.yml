name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Deploy to staging
      run: |
        echo "Desplegando en el entorno de pruebas (Staging)..."
        # Comando de despliegue en servidor de pruebas:
        # ssh user@staging-server "cd /app && git pull && docker-compose up -d"

    - name: Deploy to production
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Desplegando en el entorno de producción..."
        # Comando de despliegue en servidor de producción:
        # ssh user@prod-server "cd /app && git pull && docker-compose up -d"